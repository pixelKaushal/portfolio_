<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaushal Gautam | DevLog Terminal</title>
    <style>
        header a{
            color: var(--text-main);
            text-decoration: none;
        }
        /* --- Design Tokens & Global Reset --- */
        :root {
            --bg-color: #0a0a0d;
            --card-bg: #111116;
            --border-color: #1c1c28;
            --text-main: #f0f0f5;
            --text-muted: #6e6e80;
            --accent-cyan: #00f0ff;
            --accent-purple: #9d4edd;
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: linear-gradient(rgba(18, 18, 24, 0.7) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(18, 18, 24, 0.7) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* --- Navigation Styles --- */
        header {
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(10, 10, 13, 0.8);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav {
            max-width: 1000px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            border-radius: 4px;
        }

        h1.logo {
            font-size: 1.1rem;
            font-family: var(--font-mono);
            font-weight: 700;
        }

        h1.logo a {
            color: var(--text-main);
            text-decoration: none;
        }

        h1.logo span {
            color: var(--accent-cyan);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: var(--font-mono);
            transition: color 0.2s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-cyan);
        }

        /* --- Main Layout Frame --- */
        main {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            flex-grow: 1;
        }

        /* View State Management */
        .view-section {
            display: none;
        }
        .view-section.active-view {
            display: grid;
        }

        #feed-view {
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media (min-width: 800px) {
            #feed-view {
                grid-template-columns: 2fr 1fr;
            }
        }

        /* --- Section Label --- */
        .section-label {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            grid-column: 1 / -1;
        }

        .section-label::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        /* --- Blog Feed Component --- */
        .blog-feed {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .blog-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            transition: border-color 0.2s ease;
        }

        .blog-card:hover {
            border-color: var(--accent-cyan);
        }

        .blog-header {
            background-color: #08080b;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .blog-meta {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--accent-purple);
        }

        .blog-body {
            padding: 30px;
        }

        .blog-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .blog-excerpt {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .read-more {
            display: inline-block;
            color: var(--accent-cyan);
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
        }

        .read-more:hover {
            text-decoration: underline;
        }

        /* --- Sidebar Widgets --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .widget-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
        }

        .widget-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .widget-list {
            list-style: none;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .widget-list li {
            margin-bottom: 10px;
        }

        .widget-list a {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            justify-content: space-between;
        }

        .widget-list a:hover {
            color: var(--accent-purple);
        }

        .tag-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background-color: #0a0a0d;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 4px;
            text-decoration: none;
            font-family: var(--font-mono);
            font-size: 0.75rem;
        }

        /* --- Unified Article Read Engine Template UI --- */
        #article-view {
            grid-template-columns: 1fr;
        }

        .back-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 4px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            cursor: pointer;
            align-self: flex-start;
            margin-bottom: 30px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        .full-article {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .article-meta-row {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--accent-purple);
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
        }

        .article-main-title {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .article-content {
            color: #d1d1db;
            font-size: 1.05rem;
            line-height: 1.8;
        }

        /* Standard internal formatting blocks inside data array */
        .article-content p {
            margin-bottom: 20px;
        }

        .article-content code {
            font-family: var(--font-mono);
            background-color: #1c1c28;
            color: var(--accent-cyan);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .article-content pre {
            background-color: #08080b;
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            overflow-x: auto;
            margin: 25px 0;
            color: #a0a0b5;
        }

        /* --- Footer --- */
        footer {
            border-top: 1px solid var(--border-color);
            padding: 25px 20px;
            text-align: center;
            font-size: 0.8rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            margin-top: auto;
        }
    </style>
        <link rel="icon" href="icon_K.png" type="image/x-icon">

</head>
<body>

    <header>
        <nav>
            <div class="logo-container">
                <img src="icon_K.png" alt="K" class="brand-icon" onerror="this.style.display='none'">
                <div class="logo"><a href="index.html">kaushal<span>@workspace</span></a></div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">./about_me</a></li>
                <li><a href="projects.html">./projects</a></li>
                <li><a href="blog.html" class="active">./devlog</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="feed-view" class="view-section active-view">
            <div class="section-label">DevLog Subsystem // Broadmittent Musings</div>
            
            <section class="blog-feed" id="dynamic-feed-target"></section>

            <aside class="sidebar">
                <div class="widget-box">
                    <h4 class="widget-title">Categories</h4>
                    <ul class="widget-list">
                        <li><a href="#"><span>/architecture</span> <span>(2)</span></a></li>
                        <li><a href="#"><span>/game_dev</span> <span>(1)</span></a></li>
                        <li><a href="#"><span>/automation</span> <span>(1)</span></a></li>
                    </ul>
                </div>

                <div class="widget-box">
                    <h4 class="widget-title">Sys_Tags</h4>
                    <div class="tag-cloud">
                        <span class="tag">#pygame</span>
                        <span class="tag">#python</span>
                        <span class="tag">#css</span>
                        <span class="tag">#bash</span>
                        <span class="tag">#javascript</span>
                    </div>
                </div>
            </aside>
        </div>

        <div id="article-view" class="view-section">
            <button class="back-btn" onclick="renderFeedState()">[RETURN_TO_REGISTRY] &larr;</button>
            <article class="full-article" id="full-article-target"></article>
        </div>
    </main>

    <footer>
        <p>SYSTEM STATUS: ONLINE // YEAR: 2026</p>
    </footer>
    <script src="blogs.js"></script>
</body>
</html>
